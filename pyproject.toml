[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contractguard"
version = "0.1.0"
description = "Detect breaking changes in FastAPI API contracts"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.0",
    "typer>=0.12.0"
]

[project.scripts]
contractguard = "contractguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]